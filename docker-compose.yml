services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -hf
      - ${QWEN_MODEL:-Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "2048"
      - -n
      - "384"
      - -t
      - "2"
    volumes:
      - qwen_cache:/root/.cache
    mem_limit: 2500m
    cpus: 2
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_NAME: /data/support.db
      QWEN_API_URL: http://qwen:8080/v1/chat/completions
      QWEN_MODEL: Qwen2.5-1.5B-Instruct
      CORS_ORIGINS: http://localhost,http://localhost:5173,https://drunteam.ru,https://www.drunteam.ru
    volumes:
      - database_data:/data
    depends_on:
      - qwen
    mem_limit: 400m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    mem_limit: 128m
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: bot.Dockerfile
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    mem_limit: 192m
    restart: unless-stopped

volumes:
  qwen_cache:
  database_data:

