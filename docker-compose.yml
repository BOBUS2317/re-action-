services:
  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_NAME: /data/support.db
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      CORS_ORIGINS: http://localhost,http://localhost:5173,https://drunteam.ru,https://www.drunteam.ru
    volumes:
      - database_data:/data
    mem_limit: 400m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    mem_limit: 128m
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: bot.Dockerfile
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    mem_limit: 192m
    restart: unless-stopped

volumes:
  database_data:
